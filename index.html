<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Enduro Mobile V3</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    touch-action:none;
}
canvas{
    display:block;
}
#start{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    padding:20px 40px;
    font-size:25px;
}
</style>
</head>

<body>

<button id="start">START</button>
<canvas id="game"></canvas>


<script>

const canvas=document.querySelector("canvas");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;


let running=false;

let speed=0.015;
let distance=0;


let player={
    lane:0,
    targetLane:0,
    x:canvas.width/2,
    y:canvas.height-130
};


let roadLines=[];

for(let i=0;i<20;i++){
    roadLines.push({
        z:i/20
    });
}


let enemies=[];


// رسم الطريق بمنظور

function drawRoad(){

    ctx.fillStyle="#4da6ff";
    ctx.fillRect(0,0,canvas.width,canvas.height*0.45);


    ctx.fillStyle="#777";
    ctx.fillRect(
        0,
        canvas.height*0.45,
        canvas.width,
        canvas.height
    );


    // الطريق
    ctx.fillStyle="#333";

    ctx.beginPath();

    ctx.moveTo(canvas.width*0.47,canvas.height*0.45);
    ctx.lineTo(canvas.width*0.53,canvas.height*0.45);

    ctx.lineTo(canvas.width*0.9,canvas.height);
    ctx.lineTo(canvas.width*0.1,canvas.height);

    ctx.fill();



    // خطوط الحارات

    roadLines.forEach(line=>{

        line.z+=speed;

        if(line.z>1)
            line.z=0;


        let y=
        canvas.height*0.45+
        Math.pow(line.z,2)*
        canvas.height*0.55;


        let width=
        10+
        line.z*40;


        ctx.fillStyle="white";

        ctx.fillRect(
            canvas.width/2-width/2,
            y,
            width,
            8
        );


    });

}



// سيارة

function drawCar(x,y,color,scale=1){

ctx.fillStyle=color;

ctx.beginPath();

ctx.roundRect(
x-25*scale,
y,
50*scale,
90*scale,
10
);

ctx.fill();


ctx.fillStyle="black";

ctx.fillRect(
x-15*scale,
y+15*scale,
30*scale,
25*scale
);

}


// سيارات الخصم

function spawn(){

if(Math.random()<0.03){

let lane=Math.floor(Math.random()*3)-1;


enemies.push({

z:0,
lane:lane

});

}

}



function moveEnemies(){

enemies.forEach(e=>{

e.z+=speed;


});

enemies=enemies.filter(e=>e.z<1);

}



function drawEnemies(){

enemies.forEach(e=>{


let y=
canvas.height*0.45+
e.z*e.z*
canvas.height*0.55;


let x=
canvas.width/2+
e.lane*
(e.z*canvas.width*0.45);


let size=0.3+e.z;


drawCar(x,y,"red",size);


});

}



// تحريك اللاعب

function updatePlayer(){

player.lane +=
(player.targetLane-player.lane)*0.15;


player.x=
canvas.width/2+
player.lane*
canvas.width*0.18;

}




function collision(){

enemies.forEach(e=>{

if(e.z>0.75){

let lane=Math.round(e.lane);


if(
Math.abs(player.lane-lane)<0.4
){

alert("Game Over\nDistance "+Math.floor(distance));
location.reload();

}

}

});

}




function loop(){

if(!running)return;


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


drawRoad();

spawn();

moveEnemies();

drawEnemies();

updatePlayer();

drawCar(
player.x,
player.y,
"blue",
1
);


distance+=speed*100;


ctx.fillStyle="white";
ctx.font="25px Arial";

ctx.fillText(
"Distance: "+Math.floor(distance),
20,
40
);


collision();


requestAnimationFrame(loop);

}




// Swipe

let sx=0;

canvas.addEventListener("touchstart",e=>{
sx=e.touches[0].clientX;
});


canvas.addEventListener("touchend",e=>{

let dx=
e.changedTouches[0].clientX-sx;


if(dx>50 && player.targetLane<1)
player.targetLane++;


if(dx<-50 && player.targetLane>-1)
player.targetLane--;


});



document.getElementById("start").onclick=()=>{

document.getElementById("start").style.display="none";

running=true;

loop();

};


</script>

</body>
</html>
