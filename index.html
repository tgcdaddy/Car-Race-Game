<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Enduro Mobile V2</title>

<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#000;
    touch-action:none;
}
canvas{
    display:block;
}
#start{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:28px;
    padding:20px 45px;
    border-radius:20px;
}
</style>
</head>

<body>

<button id="start">START</button>
<canvas id="game"></canvas>

<script>

const c=document.getElementById("game");
const ctx=c.getContext("2d");

c.width=innerWidth;
c.height=innerHeight;

let playing=false;

let score=0;
let speed=7;
let stage=1;

let roadY=0;

let lanes=3;
let lane=c.width/lanes;

let player={
    lane:1,
    x:lane*1.5,
    y:c.height-150,
};


let enemies=[];


// رسم الطريق

function road(){

    let sky=stage%4;

    if(sky==0)
        ctx.fillStyle="#001";
    else if(sky==1)
        ctx.fillStyle="#87ceeb";
    else if(sky==2)
        ctx.fillStyle="#555";
    else
        ctx.fillStyle="#ddd";

    ctx.fillRect(0,0,c.width,c.height);


    // الطريق
    ctx.fillStyle="#333";

    ctx.beginPath();
    ctx.moveTo(lane/2,0);
    ctx.lineTo(c.width-lane/2,0);
    ctx.lineTo(c.width*0.85,c.height);
    ctx.lineTo(c.width*0.15,c.height);
    ctx.fill();


    // خطوط الطريق

    ctx.strokeStyle="white";
    ctx.lineWidth=4;
    ctx.setLineDash([40,50]);

    for(let i=1;i<3;i++){

        let top=lane/2+i*lane;

        ctx.beginPath();
        ctx.moveTo(top,0);
        ctx.lineTo(
            c.width*0.15+i*(c.width*0.7/3),
            c.height
        );
        ctx.stroke();
    }

    ctx.setLineDash([]);

}



// سيارة

function car(x,y,color){

    ctx.fillStyle=color;

    ctx.beginPath();
    ctx.roundRect(
        x-25,
        y,
        50,
        90,
        12
    );
    ctx.fill();


    ctx.fillStyle="#111";

    ctx.fillRect(
        x-17,
        y+15,
        34,
        25
    );


    ctx.fillStyle="black";

    ctx.fillRect(
        x-32,
        y+20,
        7,
        25
    );

    ctx.fillRect(
        x+25,
        y+20,
        7,
        25
    );

}


// إنشاء سيارات

function spawn(){

    if(Math.random()<0.025){

        let l=Math.floor(Math.random()*3);

        enemies.push({
            lane:l,
            x:lane/2+l*lane+lane/2,
            y:-120
        });

    }
}


// حركة السيارات

function enemiesMove(){

    enemies.forEach(e=>{
        e.y+=speed;
    });

    enemies=enemies.filter(e=>e.y<c.height+200);
}


// تصادم

function hit(){

    for(let e of enemies){

        if(
            e.lane==player.lane &&
            Math.abs(e.y-player.y)<80
        ){

            alert(
            "Game Over\nScore: "+
            Math.floor(score)
            );

            location.reload();
        }
    }
}


// اللعبة

function loop(){

if(!playing)return;

ctx.clearRect(0,0,c.width,c.height);

road();

spawn();
enemiesMove();

enemies.forEach(e=>{
    car(e.x,e.y,"red");
});


car(player.x,player.y,"blue");


score+=0.1;

if(score%500<0.1)
    stage++;


if(stage>4)
    stage=1;


ctx.fillStyle="white";
ctx.font="24px Arial";

ctx.fillText(
"Score: "+Math.floor(score),
20,35
);

ctx.fillText(
"Stage: "+stage,
20,70
);


speed+=0.001;

hit();

requestAnimationFrame(loop);

}


// Swipe

let sx,sy;

c.addEventListener("touchstart",e=>{
sx=e.touches[0].clientX;
sy=e.touches[0].clientY;
});


c.addEventListener("touchend",e=>{

let dx=e.changedTouches[0].clientX-sx;
let dy=e.changedTouches[0].clientY-sy;


if(Math.abs(dx)>50){

if(dx>0 && player.lane<2)
player.lane++;

if(dx<0 && player.lane>0)
player.lane--;

player.x=
lane/2+
player.lane*lane+
lane/2;

}


if(dy<-60)
speed+=3;


});



document.getElementById("start").onclick=()=>{

document.getElementById("start").style.display="none";

playing=true;

loop();

};


</script>

</body>
</html>
